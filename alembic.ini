# Database migrations (Alembic). A "migration" is a small, versioned script that changes the
# database structure step by step, so existing data is kept when the app is upgraded.
# The app runs pending migrations automatically when it starts (see app/migrate.py).
[alembic]
script_location = migrations
prepend_sys_path = .
# The database address comes from the DATABASE_URL setting, not from this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
